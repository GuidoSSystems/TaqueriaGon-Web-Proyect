services:
  # node js configuration
  backend:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app 
      - /app/node_modules 
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      - basededatos

  # data base configuration
  basededatos:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql 
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql 

volumes:
  db_data: