services:
  # node js configuration
  backend:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - PORT=3000
      # Dentro de Docker la base de datos se llama como el servicio
      - DB_HOST=basededatos
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      basededatos:
        condition: service_healthy

  # data base configuration
  basededatos:
    image: mysql:8.0
    ports:
      # 3307 para no chocar con un MySQL instalado en (3306)
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # Listo solo cuando init.sql ya creó las tablas (tabla usuarios)
      test: ["CMD-SHELL", "mysql -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1 FROM taqueriadb.usuarios LIMIT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db_data:
