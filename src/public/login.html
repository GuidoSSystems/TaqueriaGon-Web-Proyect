<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Taquería Gon</title>
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="app-content login-wrapper">
        <section class="login-card">
            <div class="login-logo"><img src="./images/logoTG.jpeg" alt=""></div>
            <h1>Taquería Gon</h1>
            <p class="login-subtitle">Inicia sesión para continuar</p>

            <form id="loginForm" novalidate>
                <div class="field">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" autocomplete="username" placeholder="Tu usuario">
                    <small class="field-error" id="usuarioError"></small>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <div class="password-box">
                        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Tu contraseña">
                        <button type="button" id="togglePassword" aria-label="Mostrar contraseña">👁</button>
                    </div>
                    <small class="field-error" id="passwordError"></small>
                </div>

                <div class="form-error" id="formError" role="alert"></div>

                <button type="submit" id="loginBtn" class="btn-primary">Entrar</button>
            </form>
        </section>
    </main>

    <script src="js/navbar.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
